<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07101c" />
    <title>SafarSet offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06101c; color: #eef5fb; font: 16px system-ui, sans-serif; padding: 24px; }
      main { width: min(100%, 520px); border: 1px solid rgb(255 255 255 / 0.14); background: #0b1928; padding: 32px; }
      p:first-child { color: #8edff0; font: 12px ui-monospace, monospace; letter-spacing: .14em; }
      h1 { margin: 20px 0 12px; font-size: 28px; }
      p { color: #9aaabd; line-height: 1.6; }
      button { margin-top: 16px; border: 0; background: #f5a524; color: #07101c; padding: 12px 16px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>RECOVERY CONTROL / OFFLINE</p>
      <h1>Network unavailable</h1>
      <p>SafarSet could not load this page. Existing recovery evidence stays in this browser. Reconnect, then retry.</p>
      <button type="button" onclick="location.reload()">Retry connection</button>
    </main>
  </body>
</html>
