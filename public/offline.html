<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#102a43" />
    <title>SafarSet offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7fafc; color: #102a43; font: 16px system-ui, sans-serif; padding: 24px; }
      main { width: min(100%, 520px); border: 1px solid #d9e2ec; border-radius: 16px; background: white; padding: 32px; }
      p:first-child { color: #147d92; font: 12px ui-monospace, monospace; letter-spacing: .14em; }
      h1 { margin: 20px 0 12px; font-size: 28px; }
      p { color: #627d98; line-height: 1.6; }
      button { margin-top: 16px; border: 0; border-radius: 8px; background: #102a43; color: white; padding: 12px 16px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>RECOVERY CONTROL / OFFLINE</p>
      <h1>Network unavailable</h1>
      <p>SafarSet could not reach the server. Customer data is not cached in the offline shell. Reconnect, then retry.</p>
      <button type="button" onclick="location.reload()">Retry connection</button>
    </main>
  </body>
</html>
