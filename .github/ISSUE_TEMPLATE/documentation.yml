name: Documentation update
description: Request or track documentation work.
title: "Docs: "
labels: ["documentation", "needs-triage"]
body:
  - type: textarea
    id: docs
    attributes:
      label: What needs to change?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source of truth
      description: Link the plan, spec, code, or decision this doc should follow.
    validations:
      required: false
