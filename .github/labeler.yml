engine:
  - changed-files:
      - any-glob-to-any-file:
          - "src/engine/**"
          - "tests/unit/**"
          - "tests/scenarios/**"

domain:
  - changed-files:
      - any-glob-to-any-file:
          - "src/domain/**"

providers:
  - changed-files:
      - any-glob-to-any-file:
          - "src/providers/**"

ui:
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/**"
          - "public/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "Documentation/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "eslint.config.mjs"
          - "vitest.config.ts"
          - "tsconfig.json"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
